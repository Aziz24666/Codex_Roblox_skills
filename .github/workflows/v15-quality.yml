name: V15 development-system quality

on:
  push:
    branches: [main, v15-development-system]
    paths:
      - 'v15/**'
      - '.github/workflows/v15-quality.yml'
  pull_request:
    paths:
      - 'v15/**'
      - '.github/workflows/v15-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v15-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Validate V15 manifests and benchmark contracts
        run: python v15/tools/v15_validate.py --root v15
      - name: Compile Python validator
        run: python -m py_compile v15/tools/v15_validate.py
      - name: Check JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("v15").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"valid JSON: {path}")
          PY
