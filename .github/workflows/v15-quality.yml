name: V15 development-system quality

on:
  push:
    branches: [main, v15-0-2-package-doctor-fix, v15-0-3-cache-cleanup, v15-0-4-full-audit-fixes]
    paths:
      - 'v15/**'
      - '.github/workflows/v15-quality.yml'
      - 'README.md'
      - 'RELEASE_NOTES_V15_0_4.md'
  pull_request:
    paths:
      - 'v15/**'
      - '.github/workflows/v15-quality.yml'
      - 'README.md'
      - 'RELEASE_NOTES_V15_0_4.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v15-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Validate V15 contracts and native Codex skills
        run: python v15/tools/v15_validate.py --root v15
      - name: Run V15 regression tests
        run: python -m unittest discover -s v15/tests -v
      - name: Compile Python tools and tests
        run: python -m py_compile v15/tools/v15_validate.py v15/tools/patch_cumulative_package.py v15/tools/audit_cumulative_package.py v15/tests/test_validator.py
      - name: Check every V15 JSON file
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = sorted(Path("v15").rglob("*.json"))
          if not paths:
              raise SystemExit("No V15 JSON files found")
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"valid JSON: {path}")
          PY

  package-v15:
    name: Package cumulative V15 overlay
    runs-on: ubuntu-24.04
    needs: [validate]
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reconstruct cumulative V14 and apply V15
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/v15-source"
          mkdir -p "$work"
          overlay="$RUNNER_TEMP/v14-overlay.tar.xz"
          cat dist/v14-overlay-b64parts/part-*.b64 | base64 --decode > "$overlay"
          echo "8ac5adfe3aaa54e33c674e979cf2814fc8f311933176f1890fadf0fa84b79158  $overlay" | sha256sum --check
          tar -xJf dist/roblox-codex-game-studio-kit-v13.tar.xz -C "$work"
          mv "$work/roblox-codex-game-studio-kit-v13" "$work/roblox-codex-game-studio-kit-v15"
          tar -xJf "$overlay" -C "$work/roblox-codex-game-studio-kit-v15"
          cp -a v15 "$work/roblox-codex-game-studio-kit-v15/"
          cp RELEASE_NOTES_V15_0_4.md "$work/roblox-codex-game-studio-kit-v15/"
          PACKAGE_ROOT="$work/roblox-codex-game-studio-kit-v15"
          python v15/tools/patch_cumulative_package.py --package-root "$PACKAGE_ROOT"
          python -m pip install --disable-pip-version-check --requirement "$PACKAGE_ROOT/requirements-ci.txt"
          python -m unittest discover -s "$PACKAGE_ROOT/v15/tests" -v
          (cd "$PACKAGE_ROOT" && PYTHONPATH="$PACKAGE_ROOT" python -m unittest discover -s tools/tests -v)
          python "$PACKAGE_ROOT/tools/v14_pack_doctor.py" "$PACKAGE_ROOT"
          # The inherited package doctor byte-compiles Python sources; remove those
          # generated caches and rebuild package metadata/checksums as the final step.
          python v15/tools/patch_cumulative_package.py --package-root "$PACKAGE_ROOT"
          python "$PACKAGE_ROOT/v15/tools/v15_validate.py" --root "$PACKAGE_ROOT/v15"
          if find "$PACKAGE_ROOT" \( -type d -name '__pycache__' -o -type f \( -name '*.pyc' -o -name '*.pyo' \) \) -print -quit | grep -q .; then
            echo "Generated Python cache files must not be included in the release package."
            exit 1
          fi
          python "$PACKAGE_ROOT/v15/tools/audit_cumulative_package.py" --root "$PACKAGE_ROOT"
          (cd "$PACKAGE_ROOT" && sha256sum --check SHA256SUMS.txt && sha256sum --check V14_SHA256SUMS.txt && sha256sum --check V15_SHA256SUMS.txt)
          echo "PACKAGE_ROOT=$PACKAGE_ROOT" >> "$GITHUB_ENV"
      - name: Create cumulative V15 archives and compare contents
        run: |
          set -euo pipefail
          parent="$(dirname "$PACKAGE_ROOT")"
          name="$(basename "$PACKAGE_ROOT")"
          tar -cJf "$RUNNER_TEMP/${name}.tar.xz" --directory "$parent" "$name"
          (cd "$parent" && zip -qr "$RUNNER_TEMP/${name}.zip" "$name")
          test -s "$RUNNER_TEMP/${name}.tar.xz"
          test -s "$RUNNER_TEMP/${name}.zip"
          unzip -t "$RUNNER_TEMP/${name}.zip"
          xz -t "$RUNNER_TEMP/${name}.tar.xz"
          mkdir -p "$RUNNER_TEMP/package-check-zip" "$RUNNER_TEMP/package-check-tar"
          unzip -q "$RUNNER_TEMP/${name}.zip" -d "$RUNNER_TEMP/package-check-zip"
          tar -xJf "$RUNNER_TEMP/${name}.tar.xz" -C "$RUNNER_TEMP/package-check-tar"
          diff -qr "$RUNNER_TEMP/package-check-zip/$name" "$RUNNER_TEMP/package-check-tar/$name"
          test -f "$RUNNER_TEMP/package-check-zip/$name/.agents/skills/roblox-project-intelligence/SKILL.md"
          test -f "$RUNNER_TEMP/package-check-zip/$name/INDEX_V15.md"
          test -f "$RUNNER_TEMP/package-check-zip/$name/V15_SHA256SUMS.txt"
          test -f "$RUNNER_TEMP/package-check-zip/$name/SHA256SUMS.txt"
          test -f "$RUNNER_TEMP/package-check-zip/$name/schemas/v9-editor-field-descriptors.schema.json"
          if find "$RUNNER_TEMP/package-check-zip/$name" \( -type d -name '__pycache__' -o -type f \( -name '*.pyc' -o -name '*.pyo' \) \) -print -quit | grep -q .; then
            echo "Release archive contains Python cache files."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: roblox-codex-game-studio-kit-v15
          path: |
            ${{ runner.temp }}/roblox-codex-game-studio-kit-v15.zip
            ${{ runner.temp }}/roblox-codex-game-studio-kit-v15.tar.xz
          if-no-files-found: error
          retention-days: 14

  release-v15:
    name: Publish V15 GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-v15]')
    runs-on: ubuntu-24.04
    needs: [validate, package-v15]
    permissions:
      contents: write
      actions: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download validated V15 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name roblox-codex-game-studio-kit-v15 --dir "$RUNNER_TEMP/release-assets"
          test -s "$RUNNER_TEMP/release-assets/roblox-codex-game-studio-kit-v15.zip"
          test -s "$RUNNER_TEMP/release-assets/roblox-codex-game-studio-kit-v15.tar.xz"
      - name: Publish versioned V15 patch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < v15/VERSION)"
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite."
            exit 1
          fi
          cp "$RUNNER_TEMP/release-assets/roblox-codex-game-studio-kit-v15.zip" "$RUNNER_TEMP/roblox-codex-game-studio-kit-${TAG}.zip"
          cp "$RUNNER_TEMP/release-assets/roblox-codex-game-studio-kit-v15.tar.xz" "$RUNNER_TEMP/roblox-codex-game-studio-kit-${TAG}.tar.xz"
          gh release create "$TAG" \
            "$RUNNER_TEMP/roblox-codex-game-studio-kit-${TAG}.zip" \
            "$RUNNER_TEMP/roblox-codex-game-studio-kit-${TAG}.tar.xz" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "V15.0.4 — Roblox Codex Game Studio Kit" \
            --notes-file RELEASE_NOTES_V15_0_4.md
