name: V14 Roblox toolkit CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: V14 Python preflight and regression suite
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Reconstruct cumulative V14 source
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/v14-source"
          mkdir -p "$work"
          overlay="$RUNNER_TEMP/v14-overlay.tar.xz"
          cat dist/v14-overlay-b64parts/part-*.b64 | base64 --decode > "$overlay"
          echo "8ac5adfe3aaa54e33c674e979cf2814fc8f311933176f1890fadf0fa84b79158  $overlay" | sha256sum --check
          tar -xJf dist/roblox-codex-game-studio-kit-v13.tar.xz -C "$work"
          mv "$work/roblox-codex-game-studio-kit-v13" "$work/roblox-codex-game-studio-kit-v14"
          tar -xJf "$overlay" -C "$work/roblox-codex-game-studio-kit-v14"
          echo "SOURCE_ROOT=$work/roblox-codex-game-studio-kit-v14" >> "$GITHUB_ENV"
      - name: Install pinned Python dependencies
        run: python -m pip install --requirement "$SOURCE_ROOT/requirements-ci.txt"
      - name: Run V14 preflight and regression suite
        run: python "$SOURCE_ROOT/tools/v14_ci_preflight.py" "$SOURCE_ROOT"

  roblox-build:
    name: Luau compile and four Rojo builds
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reconstruct cumulative V14 source
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/v14-source"
          mkdir -p "$work"
          overlay="$RUNNER_TEMP/v14-overlay.tar.xz"
          cat dist/v14-overlay-b64parts/part-*.b64 | base64 --decode > "$overlay"
          echo "8ac5adfe3aaa54e33c674e979cf2814fc8f311933176f1890fadf0fa84b79158  $overlay" | sha256sum --check
          tar -xJf dist/roblox-codex-game-studio-kit-v13.tar.xz -C "$work"
          mv "$work/roblox-codex-game-studio-kit-v13" "$work/roblox-codex-game-studio-kit-v14"
          tar -xJf "$overlay" -C "$work/roblox-codex-game-studio-kit-v14"
          echo "SOURCE_ROOT=$work/roblox-codex-game-studio-kit-v14" >> "$GITHUB_ENV"
      - name: Install pinned Luau CLI
        env:
          LUAU_VERSION: '0.746'
          LUAU_SHA256: '30f11c9cde8be2dc0e3066d210705532aac3726a2db89a6c5078080b6faa6cf8'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/luau-ubuntu.zip"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/luau-ubuntu.zip" \
            --output "$archive"
          echo "${LUAU_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/luau"
          unzip -q "$archive" -d "$RUNNER_TEMP/luau"
          compiler="$(find "$RUNNER_TEMP/luau" -type f -name luau-compile -print -quit)"
          test -n "$compiler"
          chmod +x "$compiler"
          echo "LUAU_COMPILER=$compiler" >> "$GITHUB_ENV"
          test -x "$compiler"
      - name: Compile every Lua and Luau source file
        run: python "$SOURCE_ROOT/tools/compile_luau_sources.py" --root "$SOURCE_ROOT" --compiler "$LUAU_COMPILER" --min-files 65
      - name: Install pinned Rojo CLI
        env:
          ROJO_VERSION: '7.7.1'
          ROJO_SHA256: '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/rojo-linux-x86_64.zip"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip" \
            --output "$archive"
          echo "${ROJO_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/rojo"
          unzip -q "$archive" -d "$RUNNER_TEMP/rojo"
          rojo_bin="$(find "$RUNNER_TEMP/rojo" -type f -name rojo -print -quit)"
          test -n "$rojo_bin"
          chmod +x "$rojo_bin"
          echo "ROJO_BIN=$rojo_bin" >> "$GITHUB_ENV"
          "$rojo_bin" --version
      - name: Build sample Roblox experience
        run: |
          mkdir -p "$RUNNER_TEMP/roblox-builds"
          "$ROJO_BIN" build "$SOURCE_ROOT/project-template/default.project.json" \
            --output "$RUNNER_TEMP/roblox-builds/RobloxExperience.rbxlx"
          test -s "$RUNNER_TEMP/roblox-builds/RobloxExperience.rbxlx"
      - name: Build Content Factory Studio plugin
        run: |
          "$ROJO_BIN" build "$SOURCE_ROOT/studio-plugin/default.project.json" \
            --output "$RUNNER_TEMP/roblox-builds/ContentFactoryPlugin.rbxmx"
          test -s "$RUNNER_TEMP/roblox-builds/ContentFactoryPlugin.rbxmx"
      - name: Build V14 Studio Test Runner plugin
        run: |
          "$ROJO_BIN" build "$SOURCE_ROOT/studio-test-plugin/default.project.json" \
            --output "$RUNNER_TEMP/roblox-builds/V14StudioTestRunner.rbxmx"
          test -s "$RUNNER_TEMP/roblox-builds/V14StudioTestRunner.rbxmx"
      - name: Build disposable V14 Studio test fixture
        run: |
          "$ROJO_BIN" build "$SOURCE_ROOT/examples/v14/studio-test-fixture/default.project.json" \
            --output "$RUNNER_TEMP/roblox-builds/V14StudioTestFixture.rbxlx"
          test -s "$RUNNER_TEMP/roblox-builds/V14StudioTestFixture.rbxlx"
      - name: Upload Roblox build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roblox-v14-build-artifacts
          path: ${{ runner.temp }}/roblox-builds/
          if-no-files-found: error
          retention-days: 14

  package-v14:
    name: Package cumulative V14 source archives
    runs-on: ubuntu-24.04
    needs: [python-quality, roblox-build]
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reconstruct cumulative V14 source
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/v14-source"
          mkdir -p "$work"
          overlay="$RUNNER_TEMP/v14-overlay.tar.xz"
          cat dist/v14-overlay-b64parts/part-*.b64 | base64 --decode > "$overlay"
          echo "8ac5adfe3aaa54e33c674e979cf2814fc8f311933176f1890fadf0fa84b79158  $overlay" | sha256sum --check
          tar -xJf dist/roblox-codex-game-studio-kit-v13.tar.xz -C "$work"
          mv "$work/roblox-codex-game-studio-kit-v13" "$work/roblox-codex-game-studio-kit-v14"
          tar -xJf "$overlay" -C "$work/roblox-codex-game-studio-kit-v14"
          echo "SOURCE_ROOT=$work/roblox-codex-game-studio-kit-v14" >> "$GITHUB_ENV"
      - name: Create complete V14 ZIP and TAR.XZ
        run: |
          set -euo pipefail
          package_dir="$(dirname "$SOURCE_ROOT")"
          package_name="$(basename "$SOURCE_ROOT")"
          tar -cJf "$RUNNER_TEMP/${package_name}.tar.xz" --directory "$package_dir" "$package_name"
          (cd "$package_dir" && zip -qr "$RUNNER_TEMP/${package_name}.zip" "$package_name")
          test -s "$RUNNER_TEMP/${package_name}.tar.xz"
          test -s "$RUNNER_TEMP/${package_name}.zip"
      - name: Upload complete V14 package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roblox-codex-game-studio-kit-v14
          path: |
            ${{ runner.temp }}/roblox-codex-game-studio-kit-v14.tar.xz
            ${{ runner.temp }}/roblox-codex-game-studio-kit-v14.zip
          if-no-files-found: error
          retention-days: 14
