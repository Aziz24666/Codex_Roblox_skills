name: V18 cumulative quality and release

on:
  push:
    branches: [main, v18-release-staging]
    paths:
      - 'v18/**'
      - 'dist/v17-baseline-b64parts/**'
      - '.github/workflows/v18-quality.yml'
      - 'README.md'
      - 'RELEASE_NOTES_V18.md'
      - 'RELEASE_NOTES_V18_0_1.md'
  pull_request:
    branches: [main]
    paths:
      - 'v18/**'
      - 'dist/v17-baseline-b64parts/**'
      - '.github/workflows/v18-quality.yml'
      - 'README.md'
      - 'RELEASE_NOTES_V18.md'
      - 'RELEASE_NOTES_V18_0_1.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v18-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overlay-policy:
    name: Validate V18 overlay and monetization policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Validate all V18 overlay skills and economy routing
        run: python v18/tools/validate_v18_overlay.py
      - name: Run no-gambling and fair monetization regression tests
        run: python -m unittest v18/tests/test_monetization_policy.py -v

  package:
    name: Reconstruct, integrate, verify, and package V18
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'

      - name: Reconstruct pinned V17 baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/roblox-codex-game-studio-kit-v17.tar.xz"
          cat dist/v17-baseline-b64parts/part-*.b64 | base64 --decode > "$baseline"
          echo "6679380cdfd962611645bd6b9427690ef7d036784ba033825480847026cf8c61  $baseline" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/v17-extract"
          tar -xJf "$baseline" -C "$RUNNER_TEMP/v17-extract"
          mv "$RUNNER_TEMP/v17-extract/roblox-codex-game-studio-kit-v17" "$RUNNER_TEMP/roblox-codex-game-studio-kit-v18"
          echo "PACKAGE_ROOT=$RUNNER_TEMP/roblox-codex-game-studio-kit-v18" >> "$GITHUB_ENV"

      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check --requirement v18/requirements-ci.txt --requirement "$PACKAGE_ROOT/requirements-ci.txt"

      - name: Integrate V18 into cumulative package
        run: |
          set -euo pipefail
          python v18/tools/patch_cumulative_package.py --package-root "$PACKAGE_ROOT"
          mkdir -p "$PACKAGE_ROOT/.github/workflows"
          cp .github/workflows/v18-quality.yml "$PACKAGE_ROOT/.github/workflows/v18-quality.yml"

      - name: Run complete cumulative verification
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: ${{ github.workspace }}:${{ env.PACKAGE_ROOT }}
        run: python "$PACKAGE_ROOT/v18/tools/v18.py" verify --root "$PACKAGE_ROOT"

      - name: Confirm cumulative package inventory and skill count
        shell: bash
        run: |
          set -euo pipefail
          test "$(find "$PACKAGE_ROOT/.agents/skills" -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l | tr -d ' ')" = "175"
          test -s "$PACKAGE_ROOT/v18/data/skill-registry.json"
          test -s "$PACKAGE_ROOT/INDEX_V18.md"
          test -s "$PACKAGE_ROOT/RELEASE_NOTES_V18.md"
          python "$PACKAGE_ROOT/v18/tools/audit_cumulative_package.py" --root "$PACKAGE_ROOT"

      - name: Build and compare release archives
        shell: bash
        run: |
          set -euo pipefail
          parent="$(dirname "$PACKAGE_ROOT")"
          name="$(basename "$PACKAGE_ROOT")"
          cd "$parent"
          tar -cJf "$RUNNER_TEMP/roblox-codex-game-studio-kit-v18.tar.xz" "$name"
          zip -qr "$RUNNER_TEMP/roblox-codex-game-studio-kit-v18.zip" "$name"
          unzip -t "$RUNNER_TEMP/roblox-codex-game-studio-kit-v18.zip"
          xz -t "$RUNNER_TEMP/roblox-codex-game-studio-kit-v18.tar.xz"
          mkdir -p "$RUNNER_TEMP/check-zip" "$RUNNER_TEMP/check-tar"
          unzip -q "$RUNNER_TEMP/roblox-codex-game-studio-kit-v18.zip" -d "$RUNNER_TEMP/check-zip"
          tar -xJf "$RUNNER_TEMP/roblox-codex-game-studio-kit-v18.tar.xz" -C "$RUNNER_TEMP/check-tar"
          diff -qr "$RUNNER_TEMP/check-zip/$name" "$RUNNER_TEMP/check-tar/$name"
          sha256sum "$RUNNER_TEMP/roblox-codex-game-studio-kit-v18.zip" "$RUNNER_TEMP/roblox-codex-game-studio-kit-v18.tar.xz" > "$RUNNER_TEMP/SHA256SUMS-RELEASE.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: roblox-codex-game-studio-kit-v18
          path: |
            ${{ runner.temp }}/roblox-codex-game-studio-kit-v18.zip
            ${{ runner.temp }}/roblox-codex-game-studio-kit-v18.tar.xz
            ${{ runner.temp }}/SHA256SUMS-RELEASE.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish V18.0.1 GitHub Release
    if: github.repository == 'Aziz24666/Codex_Roblox_skills' && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-v18.0.1]')
    runs-on: ubuntu-24.04
    needs: [package]
    permissions:
      contents: write
      actions: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: roblox-codex-game-studio-kit-v18
          path: ${{ runner.temp }}/v18-release-assets

      - name: Publish immutable versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v18.0.1"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$tag" \
            "$RUNNER_TEMP/v18-release-assets/roblox-codex-game-studio-kit-v18.zip" \
            "$RUNNER_TEMP/v18-release-assets/roblox-codex-game-studio-kit-v18.tar.xz" \
            "$RUNNER_TEMP/v18-release-assets/SHA256SUMS-RELEASE.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "V18.0.1 — Roblox Codex Game Studio Kit" \
            --notes-file RELEASE_NOTES_V18_0_1.md
